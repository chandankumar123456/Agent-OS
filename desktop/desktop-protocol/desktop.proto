// Desktop Automation Protocol
// gRPC service definitions for desktop automation operations

syntax = "proto3";

package desktop_protocol;

// Desktop automation service for Windows UI automation
service DesktopAutomation {
    // Capture screen region
    rpc ScreenCapture(ScreenCaptureRequest) returns (ScreenCaptureResponse);
    
    // OCR screen region
    rpc OcrScreen(OcrScreenRequest) returns (OcrScreenResponse);
    
    // Find window by title
    rpc FindWindow(FindWindowRequest) returns (FindWindowResponse);
    
    // Click at coordinates
    rpc Click(ClickRequest) returns (ClickResponse);
    
    // Type text
    rpc Type(TypeRequest) returns (TypeResponse);
    
    // Observe desktop state
    rpc Observe(ObserveRequest) returns (ObserveResponse);
    
    // Make decision based on observation
    rpc Decide(DecideRequest) returns (DecideResponse);
    
    // Execute action
    rpc Act(ActRequest) returns (ActResponse);
    
    // Verify action result
    rpc Verify(VerifyRequest) returns (VerifyResponse);
    
    // Recover from failure
    rpc Recover(RecoverRequest) returns (RecoveryResponse);
    
    // Close session
    rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

// Screen capture request
message ScreenCaptureRequest {
    string window_id = 1;
    int32 x = 2;
    int32 y = 3;
    int32 width = 4;
    int32 height = 5;
}

// Screen capture response with image data
message ScreenCaptureResponse {
    bytes image_data = 1;
    string format = 2;  // "png", "jpeg", etc.
    string error = 3;
}

// OCR request
message OcrScreenRequest {
    bytes image_data = 1;
    string language = 2;
    bool preprocess = 3;
}

// OCR response with recognized text
message OcrScreenResponse {
    string text = 1;
    float confidence = 2;
    string error = 3;
}

// Find window request
message FindWindowRequest {
    string title = 1;
    string class_name = 2;
    bool partial_match = 3;
}

// Find window response
message FindWindowResponse {
    string window_id = 1;
    string title = 2;
    int32 x = 3;
    int32 y = 4;
    int32 width = 5;
    int32 height = 6;
    bool found = 7;
    string error = 8;
}

// Click request
message ClickRequest {
    string window_id = 1;
    int32 x = 2;
    int32 y = 3;
}

// Click response
message ClickResponse {
    bool success = 1;
    string error = 2;
}

// Type request
message TypeRequest {
    string window_id = 1;
    string text = 2;
}

// Type response
message TypeResponse {
    bool success = 1;
    string error = 2;
}

// Observe request
message ObserveRequest {
    string session_id = 1;
    bool include_text = 2;
}

// Window info message
message WindowInfo {
    string id = 1;
    string title = 2;
    int32 x = 3;
    int32 y = 4;
    int32 width = 5;
    int32 height = 6;
}

// Observe response
message ObserveResponse {
    string observation_id = 1;
    string timestamp = 2;
    int32 window_count = 3;
    repeated WindowInfo windows = 4;
    string text_content = 5;
    bool screenshot_available = 6;
    string error = 7;
}

// Decision request
message DecideRequest {
    string observation_id = 1;
}

// Decision response action
message Action {
    string action_type = 1;  // "click", "type", "screenshot"
    string target = 2;
    int32 x = 3;
    int32 y = 4;
    string text = 5;
    float confidence = 6;
    string action_id = 7;
}

// Decision response
message DecideResponse {
    string observation_id = 1;
    Action action = 2;
    string error = 3;
}

// Act request
message ActRequest {
    string session_id = 1;
    Action action = 2;
}

// Act response
message ActResponse {
    bool success = 1;
    string action_id = 2;
    bytes screenshot = 3;
    string error = 4;
}

// Verify request
message VerifyRequest {
    string session_id = 1;
    Action action = 2;
    string expected_state = 3;
    string actual_state = 4;
}

// Verify response
message VerifyResponse {
    bool verified = 1;
    float confidence = 2;
    string notes = 3;
    string error = 4;
}

// Recover request
message RecoverRequest {
    string session_id = 1;
    string failure_type = 2;
    string context = 3;
}

// Recovery response
message RecoveryResponse {
    bool success = 1;
    string recovery_action = 2;
    string notes = 3;
    string error = 4;
}

// Close session request
message CloseSessionRequest {
    string session_id = 1;
}

// Close session response
message CloseSessionResponse {
    bool success = 1;
    string error = 2;
}
