name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-supervisor:
    name: Build Supervisor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Supervisor
        working-directory: ./runtime-go
        run: go build -v ./...

      - name: Test Supervisor
        working-directory: ./runtime-go
        run: go test -v ./...

  build-ui-workspace:
    name: Build UI Workspace
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ui -> target"

      - name: Build UI workspace (excluding Tauri)
        working-directory: ./ui
        run: cargo build --workspace --exclude agentos-tauri

      - name: Clippy
        working-directory: ./ui
        run: cargo clippy --workspace --exclude agentos-tauri -- -D warnings

      - name: Test UI workspace (excluding Tauri)
        working-directory: ./ui
        run: cargo test --workspace --exclude agentos-tauri

  build-native:
    name: Build Native Workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native -> target"

      - name: Check Native Workspace
        working-directory: ./native
        run: cargo check --workspace

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: ./ui
        run: pnpm install

      - name: Build frontend
        working-directory: ./ui
        run: pnpm build

  python-check:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy py_compile pytest pytest-asyncio pytest-mock pytest-cov pytest-timeout

      - name: Lint with ruff
        run: ruff check app/ --no-unsafe-fixes

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports

      - name: Syntax check
        run: |
          python -m py_compile app/desktop_entry.py
          python -m py_compile app/main.py

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pytest-mock pytest-cov pytest-timeout

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --timeout=30 --ignore=tests/unit/test_grpc_client.py --asyncio-mode=auto
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: ""
          OPENAI_API_KEY: test-key
          SECRET_KEY: test-secret-key-for-ci-environment-32chars!!
          AGENTOS_ENV: test

      - name: Run core integration tests
        run: |
          python -m pytest tests/test_tool_parser.py tests/test_llm_mock_shapes.py tests/test_llm_normalization.py -v --timeout=60 --asyncio-mode=auto
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: ""
          OPENAI_API_KEY: test-key
          SECRET_KEY: test-secret-key-for-ci-environment-32chars!!
          AGENTOS_ENV: test

  smoke-test:
    name: Smoke Tests
    runs-on: windows-latest
    needs: [build-supervisor, build-ui-workspace]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.x'

      - name: Build Supervisor
        working-directory: ./runtime-go
        run: go build -o ../supervisor.exe ./cmd/agentos-supervisor

      - name: Build CLI
        working-directory: ./ui
        run: cargo build --release -p agentos

      - name: Run smoke tests
        working-directory: ./tests/smoke
        run: go test -v ./...
