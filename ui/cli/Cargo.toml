[package]
name = "agentos"
version = "0.1.0"
edition = "2021"
authors = ["AgentOS Team"]
description = "AgentOS CLI - Local-native autonomous agent runtime"
license = "MIT"

[[bin]]
name = "agentos"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { workspace = true, features = ["derive", "env"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# IPC client (gRPC)
agentos-ipc-client = { workspace = true }
tonic = { workspace = true }
prost-types = "0.12"
tokio-stream = "0.1"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Terminal colors
colored = "2.1"

# Table formatting for list commands
comfy-table = "7.1"

# Date/time
chrono = { workspace = true }

# Configuration directories
dirs = { workspace = true }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
mockall = "0.12"

