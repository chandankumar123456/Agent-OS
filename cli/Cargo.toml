[package]
name = "agentos"
version = "0.1.0"
edition = "2021"
authors = ["AgentOS Team"]
description = "AgentOS CLI - Local-native autonomous agent runtime"
license = "MIT"

[[bin]]
name = "agentos"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Terminal colors
colored = "2.1"

# Table formatting for list commands
comfy-table = "7.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Configuration directories
dirs = "5.0"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# IPC (Windows named pipes / Unix sockets)
#[cfg(target_os = "windows")]
#tokio-named-pipes = "0.2"

[dev-dependencies]
tempfile = "3.10"
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
strip = true
