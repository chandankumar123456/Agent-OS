name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: agentos-cli
            asset_name: agentos-cli-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: agentos.exe
            asset_name: agentos-cli-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: agentos-cli
            asset_name: agentos-cli-macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        working-directory: ./cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: cli/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  build-supervisor:
    name: Build Supervisor Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: supervisor
            asset_name: agentos-supervisor-linux-x64
          - os: windows-latest
            artifact_name: supervisor.exe
            asset_name: agentos-supervisor-windows-x64.exe
          - os: macos-latest
            artifact_name: supervisor
            asset_name: agentos-supervisor-macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Supervisor
        working-directory: ./supervisor
        run: go build -ldflags="-s -w" -o ${{ matrix.artifact_name }} .

      - name: Upload Supervisor artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: supervisor/${{ matrix.artifact_name }}

  create-release:
    name: Create GitHub Release
    needs: [build-release, build-supervisor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
