[package]
name = "agentos-tui"
version = "0.1.0"
edition = "2021"
authors = ["AgentOS Team"]
description = "AgentOS TUI - Real-time task monitoring dashboard"
license = "MIT"

[[bin]]
name = "agentos-tui"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = "0.26"

# Terminal handling
crossterm = { version = "0.27", features = ["event-stream"] }

# Async runtime
tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# HTTP/WebSocket
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Configuration directories
dirs = "5.0"

# CLI parsing (for initial args)
clap = { version = "4.5", features = ["derive"] }

# Unicode width for text wrapping
unicode-width = "0.1"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
strip = true
