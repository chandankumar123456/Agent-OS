[workspace]
members = [
    "desktop-automation",
    "ipc-protocol",
    "sandbox",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AgentOS Contributors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.37", features = ["full"] }
tonic = { version = "0.11", features = ["transport", "codegen", "prost"] }
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
