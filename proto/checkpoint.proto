syntax = "proto3";

package checkpoint;

option go_package = "github.com/AgentOS/agentos-runtime/internal/proto/checkpoint";

import "google/protobuf/timestamp.proto";

// CheckpointService handles persistent state management via SQLite
service CheckpointService {
  // Save checkpoint state
  rpc SaveCheckpoint(SaveCheckpointRequest) returns (SaveCheckpointResponse);
  
  // Get checkpoint by ID
  rpc GetCheckpoint(GetCheckpointRequest) returns (GetCheckpointResponse);
  
  // List checkpoints for a task/thread
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  
  // Get latest checkpoint for a thread
  rpc GetLatestCheckpoint(GetLatestCheckpointRequest) returns (GetCheckpointResponse);
  
  // Delete old checkpoints
  rpc CleanupCheckpoints(CleanupCheckpointsRequest) returns (CleanupCheckpointsResponse);
  
  // Streaming: Subscribe to checkpoint updates
  rpc SubscribeCheckpoints(SubscribeCheckpointsRequest) returns (stream CheckpointEvent);
}

// Checkpoint data structure
message Checkpoint {
  string id = 1;
  string thread_id = 2;
  int64 checkpoint_ns = 3;  // Nanosecond timestamp
  CheckpointType checkpoint_type = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  bytes state_blob = 7;  // Serialized LangGraph state
  bytes channel_values = 8;  // Serialized channel values
  bytes pending_sends = 9;
  repeated string parent_ids = 10;
  string metadata = 11;
  string task_id = 12;
}

enum CheckpointType {
  CHECKPOINT_TYPE_UNSPECIFIED = 0;
  CHECKPOINT_TYPE_LOCAL = 1;   // Local SQLite storage
  CHECKPOINT_TYPE_MEMORY = 2;  // In-memory (for testing)
}

// Save Checkpoint
message SaveCheckpointRequest {
  string thread_id = 1;
  CheckpointType checkpoint_type = 2;
  bytes state_blob = 3;
  bytes channel_values = 4;
  bytes pending_sends = 5;
  repeated string parent_ids = 6;
  string metadata = 7;  // JSON string
  string task_id = 8;
}

message SaveCheckpointResponse {
  bool success = 1;
  string checkpoint_id = 2;
  string error = 3;
}

// Get Checkpoint
message GetCheckpointRequest {
  string checkpoint_id = 1;
}

message GetCheckpointResponse {
  Checkpoint checkpoint = 1;
  bool success = 2;
  string error = 3;
}

// List Checkpoints
message ListCheckpointsRequest {
  string thread_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  bool include_metadata = 4;
}

message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
  int32 total_count = 2;
  bool success = 3;
  string error = 4;
}

// Get Latest Checkpoint
message GetLatestCheckpointRequest {
  string thread_id = 1;
  bool include_metadata = 2;
}

// Cleanup
message CleanupCheckpointsRequest {
  string thread_id = 1;  // Empty for all threads
  int32 keep_count = 2;  // Keep N most recent checkpoints
  int32 older_than_days = 3;  // Delete checkpoints older than N days
  bool dry_run = 4;  // Don't actually delete
}

message CleanupCheckpointsResponse {
  int32 deleted_count = 1;
  repeated string deleted_ids = 2;
  bool success = 3;
  string error = 4;
}

// Checkpoint Events
message SubscribeCheckpointsRequest {
  string thread_id = 1;  // Empty for all threads
  bool include_history = 2;
}

message CheckpointEvent {
  string checkpoint_id = 1;
  string thread_id = 2;
  CheckpointEventType event_type = 3;
  google.protobuf.Timestamp timestamp = 4;
  Checkpoint checkpoint = 5;
  string error = 6;
}

enum CheckpointEventType {
  CHECKPOINT_EVENT_UNSPECIFIED = 0;
  CHECKPOINT_EVENT_CREATED = 1;
  CHECKPOINT_EVENT_UPDATED = 2;
  CHECKPOINT_EVENT_DELETED = 3;
  CHECKPOINT_EVENT_CLEANUP = 4;
}

// Migration support
message MigrationStatus {
  string current_version = 1;
  repeated string applied_migrations = 2;
  repeated string pending_migrations = 3;
  bool migration_required = 4;
}

message RunMigrationsRequest {
  bool dry_run = 1;
  string target_version = 2;  // Empty for latest
}

message RunMigrationsResponse {
  bool success = 1;
  int32 applied_count = 2;
  repeated string applied_migrations = 3;
  string error = 4;
}

// Health check
message CheckpointHealthRequest {}

message CheckpointHealthResponse {
  bool healthy = 1;
  int64 total_checkpoints = 2;
  int64 total_size_bytes = 3;
  MigrationStatus migration_status = 4;
  string error = 5;
}
