name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-supervisor:
    name: Build Supervisor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Supervisor
        working-directory: ./supervisor
        run: go build -v ./...

      - name: Test Supervisor
        working-directory: ./supervisor
        run: go test -v ./...

  build-cli:
    name: Build CLI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "cli -> target"

      - name: Build CLI
        working-directory: ./cli
        run: cargo build --release

      - name: Test CLI
        working-directory: ./cli
        run: cargo test

  build-desktop-automation:
    name: Build Desktop Automation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"

      - name: Build Desktop Automation
        working-directory: ./desktop
        run: cargo check --package desktop-automation

  build-gui:
    name: Build GUI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: ./gui
        run: npm ci

      - name: Build frontend
        working-directory: ./gui
        run: npm run build

      - name: Check Tauri backend
        working-directory: ./gui/src-tauri
        run: cargo check

  python-check:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy py_compile

      - name: Lint with ruff
        run: ruff check app/

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports

      - name: Syntax check
        run: |
          python -m py_compile app/desktop_entry.py
          python -m py_compile app/main.py

  smoke-test:
    name: Smoke Tests
    runs-on: windows-latest
    needs: [build-supervisor, build-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Supervisor
        working-directory: ./supervisor
        run: go build -o supervisor.exe .

      - name: Build CLI
        working-directory: ./cli
        run: cargo build --release

      - name: Run smoke tests
        working-directory: ./tests/smoke
        run: go test -v ./...
