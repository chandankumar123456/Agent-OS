[package]
name = "agentos-gui"
version = "0.1.0"
description = "AgentOS GUI - Native desktop application"
authors = ["AgentOS Team"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["clipboard-write-text", "dialog-open", "dialog-save", "fs-exists", "fs-read-dir", "fs-read-file", "fs-write-file", "global-shortcut-all", "http-all", "notification-all", "os-all", "path-all", "process-exit", "process-relaunch", "shell-open", "system-tray", "window-center", "window-close", "window-hide", "window-maximize", "window-minimize", "window-set-decorations", "window-set-resizable", "window-set-size", "window-set-title", "window-show", "window-start-dragging", "window-unmaximize", "window-unminimize"] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
keyring = "3"
dirs = "5.0"
toml = "0.8"
sysinfo = "0.30"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
