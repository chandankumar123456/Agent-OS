syntax = "proto3";

package runtime;

option go_package = "github.com/AgentOS/agentos-runtime/internal/proto/runtime";

import "google/protobuf/timestamp.proto";

// RuntimeService is the primary gRPC interface between Go supervisor and Python runtime
service RuntimeService {
  // Task Management
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc StreamTaskEvents(TaskEventRequest) returns (stream TaskEvent);
  
  // Task Actions
  rpc ApproveTask(ApproveTaskRequest) returns (ApproveTaskResponse);
  rpc RejectTask(RejectTaskRequest) returns (RejectTaskResponse);
  
  // Runtime Management
  rpc GetRuntimeStatus(GetRuntimeStatusRequest) returns (RuntimeStatus);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  
  // Health Check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  
  // Configuration
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
}

// Task definition
message Task {
  string id = 1;
  string query = 2;
  TaskStatus status = 3;
  TaskType type = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  string result = 9;
  string error = 10;
  int32 progress = 11; // 0-100
  map<string, string> metadata = 12;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_PLANNING = 2;
  TASK_STATUS_EXECUTING = 3;
  TASK_STATUS_VERIFYING = 4;
  TASK_STATUS_AWAITING_APPROVAL = 5;
  TASK_STATUS_COMPLETED = 6;
  TASK_STATUS_FAILED = 7;
  TASK_STATUS_CANCELLED = 8;
  TASK_STATUS_RECOVERING = 9;
}

enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_SIMPLE = 1;        // Action V1 fast path
  TASK_TYPE_COMPLEX = 2;       // LangGraph full path
  TASK_TYPE_DESKTOP = 3;         // Desktop automation
  TASK_TYPE_AUTONOMOUS = 4;      // Autonomous mode
}

// Create Task
message CreateTaskRequest {
  string query = 1;
  TaskType type = 2;
  bool require_approval = 3;
  int32 timeout_seconds = 4;
  string parent_task_id = 5;  // For subtasks
  map<string, string> config = 6;
}

message CreateTaskResponse {
  Task task = 1;
  bool success = 2;
  string error = 3;
}

// Get Task
message GetTaskRequest {
  string task_id = 1;
}

message GetTaskResponse {
  Task task = 1;
  repeated Step steps = 2;
  bool success = 3;
  string error = 4;
}

// Step definition
message Step {
  int32 index = 1;
  string tool_name = 2;
  string tool_input = 3;
  string tool_output = 4;
  StepStatus status = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  string error = 8;
  int64 duration_ms = 9;
}

enum StepStatus {
  STEP_STATUS_UNSPECIFIED = 0;
  STEP_STATUS_PENDING = 1;
  STEP_STATUS_EXECUTING = 2;
  STEP_STATUS_COMPLETED = 3;
  STEP_STATUS_FAILED = 4;
  STEP_STATUS_SKIPPED = 5;
}

// Cancel Task
message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message CancelTaskResponse {
  bool success = 1;
  string error = 2;
}

// List Tasks
message ListTasksRequest {
  TaskStatus filter_status = 1;
  int32 limit = 2;
  int32 offset = 3;
  bool include_completed = 4;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  int32 total_count = 2;
  bool success = 3;
}

// Task Events (Streaming)
message TaskEventRequest {
  string task_id = 1;
  bool include_history = 2;
}

message TaskEvent {
  string task_id = 1;
  TaskEventType event_type = 2;
  google.protobuf.Timestamp timestamp = 3;
  Task task = 4;
  Step step = 5;
  LogMessage log = 6;
  string error = 7;
}

enum TaskEventType {
  TASK_EVENT_UNSPECIFIED = 0;
  TASK_EVENT_CREATED = 1;
  TASK_EVENT_STARTED = 2;
  TASK_EVENT_STEP_STARTED = 3;
  TASK_EVENT_STEP_COMPLETED = 4;
  TASK_EVENT_LOG = 5;
  TASK_EVENT_PROGRESS = 6;
  TASK_EVENT_COMPLETED = 7;
  TASK_EVENT_FAILED = 8;
  TASK_EVENT_CANCELLED = 9;
  TASK_EVENT_AWAITING_APPROVAL = 10;
}

// Log Message
message LogMessage {
  google.protobuf.Timestamp timestamp = 1;
  LogLevel level = 2;
  string message = 3;
  map<string, string> context = 4;
  string source = 5;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARNING = 3;
  LOG_LEVEL_ERROR = 4;
  LOG_LEVEL_CRITICAL = 5;
}

// Approval
message ApproveTaskRequest {
  string task_id = 1;
  string reason = 2;
  string approved_by = 3;
}

message ApproveTaskResponse {
  bool success = 1;
  Task task = 2;
  string error = 3;
}

message RejectTaskRequest {
  string task_id = 1;
  string reason = 2;
  string rejected_by = 3;
}

message RejectTaskResponse {
  bool success = 1;
  Task task = 2;
  string error = 3;
}

// Runtime Status
message GetRuntimeStatusRequest {
  bool include_metrics = 1;
}

message RuntimeStatus {
  string version = 1;
  RuntimeState state = 2;
  int32 active_tasks = 3;
  int32 queued_tasks = 4;
  int32 completed_tasks = 5;
  int32 failed_tasks = 6;
  RuntimeMetrics metrics = 7;
  google.protobuf.Timestamp uptime = 8;
  map<string, string> config = 9;
}

enum RuntimeState {
  RUNTIME_STATE_UNSPECIFIED = 0;
  RUNTIME_STATE_INITIALIZING = 1;
  RUNTIME_STATE_READY = 2;
  RUNTIME_STATE_BUSY = 3;
  RUNTIME_STATE_SHUTTING_DOWN = 4;
  RUNTIME_STATE_ERROR = 5;
}

message RuntimeMetrics {
  double cpu_percent = 1;
  int64 memory_bytes = 2;
  double avg_task_duration_ms = 3;
  double task_success_rate = 4;
  int64 total_tool_calls = 5;
}

// Shutdown
message ShutdownRequest {
  bool graceful = 1;
  int32 timeout_seconds = 2;
}

message ShutdownResponse {
  bool success = 1;
  string message = 2;
}

// Health Check
message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string version = 2;
  google.protobuf.Timestamp timestamp = 3;
}

// Configuration
message GetConfigRequest {
  string key = 1; // Empty for all config
}

message GetConfigResponse {
  map<string, string> config = 1;
  bool success = 2;
  string error = 3;
}

message SetConfigRequest {
  string key = 1;
  string value = 2;
}

message SetConfigResponse {
  bool success = 1;
  string error = 2;
}
